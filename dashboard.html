<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>

<body>
  
<div class="background"></div>

<div id="navbar-container"></div>
<script>
    // 🔒 Security Check: Kick them out if they aren't logged in
    if (sessionStorage.getItem("isAdminLoggedIn") !== "true") {
        window.location.href = "index.html";
    }

    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar-container").innerHTML = data;
        });
</script>

<div class="page-container">
    <div class="cards">
      <div class="card">
        <h3 style="color: #666; font-size: 16px;">Total Orders (Today)</h3>
        <p id="dashOrders" style="color: #2563eb; font-size: 28px;">Loading...</p>
      </div>
      <div class="card">
        <h3 style="color: #666; font-size: 16px;">Today's Sales</h3>
        <p id="dashSales" style="color: #16a34a; font-size: 28px;">Loading...</p>
      </div>
      <div class="card">
        <h3 style="color: #666; font-size: 16px;">Total Menu Items</h3>
        <p id="dashItems" style="color: #f59e0b; font-size: 28px;">Loading...</p>
      </div>
    </div>

    <div id="managerSection" style="display: none; max-width: 1000px; margin: 30px auto; padding: 0 20px; width: 100%;">
        <h2 style="color: white; font-family: 'Segoe UI', sans-serif; margin-bottom: 15px; font-size: 20px;">Pending Staff Approvals</h2>
        <div id="pendingUsersList" style="display: flex; flex-direction: column; gap: 12px; font-family: 'Segoe UI', sans-serif;">
            </div>
    </div>
</div>

<script>
function logout(){
  sessionStorage.clear(); // Ensure session is fully cleared
  window.location.href = "index.html";
}

// Fetch live data from your backend!
async function loadLiveStats() {
    try {
        // 1. Fetch Sales & Orders
        let salesRes = await fetch("https://canteen-backend-jjya.onrender.com/api/sales");
        let salesData = await salesRes.json();
        
        if (salesData.status === 1) {
            document.getElementById("dashOrders").innerText = salesData.data.dailyOrders;
            document.getElementById("dashSales").innerText = "₹" + salesData.data.dailySales.toLocaleString('en-IN');
        }

        // 2. Fetch Menu Items count
        let itemsRes = await fetch("https://canteen-backend-jjya.onrender.com/api/item-list");
        let itemsData = await itemsRes.json();
        
        if (itemsData.status === 1) {
            document.getElementById("dashItems").innerText = itemsData.data.length;
        }

    } catch (err) {
        console.error("Failed to load dashboard stats", err);
        document.getElementById("dashOrders").innerText = "Error";
        document.getElementById("dashSales").innerText = "Error";
        document.getElementById("dashItems").innerText = "Error";
    }
}

// ── ADMIN APPROVAL WORKFLOW LOGIC ─────────────────────────────
async function loadPendingUsers() {
    // Only show this section if the logged in user is a Manager
    if (sessionStorage.getItem("userRole") !== "manager") return;
    
    document.getElementById("managerSection").style.display = "block";
    const listDiv = document.getElementById("pendingUsersList");

    try {
        const res = await fetch("https://canteen-backend-jjya.onrender.com/api/admins/pending");
        const pendingUsers = await res.json();
        
        listDiv.innerHTML = ""; // Clear existing

        if (!pendingUsers || pendingUsers.length === 0) {
            listDiv.innerHTML = "<p style='color: #94a3b8;'>No pending approvals at this time.</p>";
            return;
        }

        // Generate a clean row for every pending user
        pendingUsers.forEach(user => {
            listDiv.innerHTML += `
                <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.2);">
                    <div>
                        <strong style="color: white; font-size: 16px;">${user.username}</strong>
                        <span style="color: #cbd5e1; font-size: 14px; margin-left: 10px; background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 5px;">Role: ${user.role}</span>
                    </div>
                    <button onclick="approveUser('${user._id}')" style="background: #16a34a; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s;">
                        Approve Access
                    </button>
                </div>
            `;
        });
    } catch (error) {
        console.error("Error loading pending users:", error);
        listDiv.innerHTML = "<p style='color: #ef4444;'>Failed to load pending requests from the database.</p>";
    }
}

async function approveUser(userId) {
    try {
        const res = await fetch(`https://canteen-backend-jjya.onrender.com/api/admins/approve/${userId}`, { 
            method: 'PUT' 
        });
        
        // If the backend request succeeds, refresh the list to make the user disappear
        if (res.ok) {
            alert("Staff member approved successfully! They can now log in.");
            loadPendingUsers(); 
        }
    } catch (error) {
        alert("Failed to connect to the server to approve user.");
    }
}

// Run functions when the page loads
loadLiveStats();
loadPendingUsers();
</script>

</body>
</html>
